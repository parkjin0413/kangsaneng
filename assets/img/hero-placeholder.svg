<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="히어로 이미지 placeholder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2822"/>
      <stop offset="55%" stop-color="#1D1B18"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
    <linearGradient id="glow" x1="20%" y1="0%" x2="90%" y2="70%">
      <stop offset="0%" stop-color="#A2703F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A2703F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#F6F4F1" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
