    <text x="960" y="530" font-size="30" font-weight="600">HERO 이미지 자리</text>
    <text x="960" y="572" font-size="18">1920×1080 권장 · 실제 현장/제품 사진 또는 영상(hero.mp4)으로 교체하세요</text>
